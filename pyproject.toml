[project]
name = "tech-challenge-agent"
version = "0.1.0"
description = "Agente de pre-originación de crédito con garantía vehicular (demo)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "httpx>=0.27",
    "pyyaml>=6",
    "pillow>=10",
    "psycopg[binary]>=3.2",
    "contracts",
    "actions-api",
    "agent",
    "llm-gateway",
    "doc-intel",
    "arize-phoenix-client>=3.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "services/actions_api",
    "services/agent",
    "services/llm_gateway",
    "services/doc_intel",
]

[tool.uv.sources]
contracts = { workspace = true }
actions-api = { workspace = true }
agent = { workspace = true }
llm-gateway = { workspace = true }
doc-intel = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["services", "tests", "packages/contracts/tests"]
addopts = "--import-mode=importlib -m 'not ollama'"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "req(id): functional requirement covered by the test",
    "db: needs the compose Postgres (make up-db)",
    "compose: needs the full compose stack (make up)",
    "ollama: needs Ollama with gemma4:12b and glm-ocr (LLM_MODE=ollama)",
]
