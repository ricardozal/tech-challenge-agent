[project]
name = "actions-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["contracts", "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actions_api"]

[tool.uv.sources]
contracts = { workspace = true }
