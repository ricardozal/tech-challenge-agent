[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["contracts", "fastapi>=0.115", "uvicorn>=0.30", "langgraph>=0.2", "langgraph-checkpoint-postgres>=2", "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "httpx>=0.27", "python-multipart>=0.0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv.sources]
contracts = { workspace = true }
