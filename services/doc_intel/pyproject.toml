[project]
name = "doc-intel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["contracts", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_intel"]

[tool.uv.sources]
contracts = { workspace = true }
